name: Portfolio quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Privacy, links, secrets, and static parsing
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Show Python version
        run: python3 --version

      - name: Check private identifiers
        run: python3 scripts/privacy_scan.py

      - name: Check secret formats safely
        run: python3 scripts/portfolio_quality.py secrets

      - name: Validate local Markdown links
        run: python3 scripts/portfolio_quality.py links

      - name: Parse Python and notebooks
        run: python3 scripts/portfolio_quality.py syntax
